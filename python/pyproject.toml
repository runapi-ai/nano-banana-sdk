[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-nano-banana"
version = "0.1.3"
description = "RunAPI Nano Banana SDK for text-to-image and image editing workflows in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "nano-banana", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "image-generation", "text-to-image", "image-api", "nano-banana-api"]
dependencies = ["runapi-core>=0.1.4"]

[project.urls]
Homepage = "https://runapi.ai/models/nano-banana"
Documentation = "https://runapi.ai/docs#sdk-nano-banana"
Source = "https://github.com/runapi-ai/nano-banana-sdk"
Issues = "https://github.com/runapi-ai/nano-banana-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "nano-banana"
